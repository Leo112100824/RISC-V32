<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">RV32I + Zicsr 五级流水线架构</title>
  <desc id="desc">展示 IF、ID、EX、MEM、WB 五个阶段、同步指令存储器、停顿、前递和异常重定向关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16834a"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #17212b; }
      .stage { fill: #fff; stroke: #334155; stroke-width: 2; rx: 10; }
      .head { fill: #e8f4ec; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526171; }
      .stage-name { font-size: 22px; font-weight: 700; }
      .module { font-size: 16px; font-weight: 600; }
      .detail { font-size: 14px; fill: #526171; }
      .label { font-size: 15px; fill: #16834a; font-weight: 600; }
      .note-title { font-size: 17px; font-weight: 700; }
      .note { font-size: 14px; fill: #526171; }
    </style>
  </defs>
  <rect width="1500" height="760" fill="#f7f9fb"/>
  <text x="60" y="68" class="title">RV32I + Zicsr 五级流水线</text>
  <text x="60" y="104" class="subtitle">同步指令 BRAM 接口 · RV32I + Zicsr · MRET · 精确同步异常</text>

  <g transform="translate(60 180)">
    <g transform="translate(0)">
      <rect width="250" height="270" class="stage"/><path d="M10 0H240Q250 0 250 10V58H0V10Q0 0 10 0Z" class="head"/>
      <text x="22" y="37" class="stage-name">IF · 取指</text>
      <text x="22" y="95" class="module">if_stage</text>
      <text x="22" y="127" class="detail">PC + 4 / redirect</text>
      <text x="22" y="154" class="detail">同步指令返回与 PC 对齐</text>
      <text x="22" y="181" class="detail">stall 时保持 IF/ID 指令</text>
      <text x="22" y="231" class="detail">imem_addr → BRAM</text>
    </g>
    <g transform="translate(300)">
      <rect width="250" height="270" class="stage"/><path d="M10 0H240Q250 0 250 10V58H0V10Q0 0 10 0Z" class="head"/>
      <text x="22" y="37" class="stage-name">ID · 译码</text>
      <text x="22" y="95" class="module">decoder · regfile</text>
      <text x="22" y="127" class="detail">译码 / 控制 / 立即数</text>
      <text x="22" y="154" class="detail">读取 rs1 / rs2</text>
      <text x="22" y="181" class="detail">load / CSR-use 冒险检测</text>
      <text x="22" y="231" class="detail">ID/EX 流水寄存器</text>
    </g>
    <g transform="translate(600)">
      <rect width="250" height="270" class="stage"/><path d="M10 0H240Q250 0 250 10V58H0V10Q0 0 10 0Z" class="head"/>
      <text x="22" y="37" class="stage-name">EX · 执行</text>
      <text x="22" y="95" class="module">forward · ALU · branch</text>
      <text x="22" y="127" class="detail">算术 / 地址计算</text>
      <text x="22" y="154" class="detail">分支与跳转决策</text>
      <text x="22" y="181" class="detail">非法指令 / ECALL / EBREAK</text>
      <text x="22" y="231" class="detail">EX/MEM 流水寄存器</text>
    </g>
    <g transform="translate(900)">
      <rect width="250" height="270" class="stage"/><path d="M10 0H240Q250 0 250 10V58H0V10Q0 0 10 0Z" class="head"/>
      <text x="22" y="37" class="stage-name">MEM · 访存</text>
      <text x="22" y="95" class="module">LSU · CSR · trap</text>
      <text x="22" y="127" class="detail">load / store</text>
      <text x="22" y="154" class="detail">CSR 读写与保护</text>
      <text x="22" y="181" class="detail">非对齐异常检查</text>
      <text x="22" y="231" class="detail">MEM/WB 流水寄存器</text>
    </g>
    <g transform="translate(1200)">
      <rect width="180" height="270" class="stage"/><path d="M10 0H170Q180 0 180 10V58H0V10Q0 0 10 0Z" class="head"/>
      <text x="22" y="37" class="stage-name">WB · 写回</text>
      <text x="22" y="95" class="module">wb_stage</text>
      <text x="22" y="127" class="detail">ALU / MEM / CSR</text>
      <text x="22" y="154" class="detail">PC+4 / IMM</text>
      <text x="22" y="181" class="detail">写回 rd</text>
      <text x="22" y="231" class="detail">x0 写入屏蔽</text>
    </g>
    <path d="M258 135H290M558 135H590M858 135H890M1158 135H1190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="310" class="label">同步取指：PC 请求后 1 拍返回，IF 暂存停顿期间当前指令</text>
    <path d="M1325 278V335H425V278" fill="none" stroke="#16834a" stroke-width="2" marker-end="url(#greenArrow)"/>
    <text x="675" y="329" class="label">WB → regfile：同拍写优先旁路</text>
    <path d="M725 278V365H125V278" fill="none" stroke="#16834a" stroke-width="2" marker-end="url(#greenArrow)"/>
    <text x="350" y="359" class="label">EX redirect / trap → IF：清除旧路径响应与 ID/EX</text>
    <path d="M1025 278V395H725V278" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="770" y="389" class="detail">EX/MEM → EX 前递</text>
  </g>

  <rect x="60" y="620" width="1380" height="82" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="84" y="653" class="note-title">控制与实现边界</text>
  <text x="84" y="680" class="note">load/CSR-use：ID 停顿 1 拍 · MEM 异常优先于 EX · 数据存储器为组合读/同步写，当前无 ready 握手</text>
</svg>
